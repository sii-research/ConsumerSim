name: Deploy Forecast Site

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * 1"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/refresh_site_data.py"
      - ".github/workflows/refresh-site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Overlay latest CSV from live-data branch if present
        run: |
          if git ls-remote --exit-code --heads origin live-data >/dev/null 2>&1; then
            git fetch --depth 1 origin live-data
            if git cat-file -e origin/live-data:site/data/consumersim_site_data.csv 2>/dev/null; then
              mkdir -p site/data
              git show origin/live-data:site/data/consumersim_site_data.csv > site/data/consumersim_site_data.csv
              echo "Loaded latest site/data/consumersim_site_data.csv from origin/live-data"
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .[dev]

      - name: Validate and normalize site CSV
        run: |
          python scripts/refresh_site_data.py \
            --input site/data/consumersim_site_data.csv \
            --output site/data/consumersim_site_data.csv

      - name: Run tests
        run: python -m pytest -q

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
